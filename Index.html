<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><style>
:root{--purple:#7553d4;--ink:#29283a;--muted:#838296;--line:#eeedf5;--bg:#f7f6fb}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:white;color:var(--ink)}button.primary{background:var(--purple);color:white;border-color:var(--purple)}button.danger{background:#d94a65;color:white}button:disabled{opacity:.5;cursor:wait}aside{position:fixed;inset:0 auto 0 0;width:220px;background:white;border-right:1px solid var(--line);padding:24px 15px;overflow:auto}aside h2{font-size:19px;margin:0 0 6px;color:var(--purple)}aside small{color:var(--muted)}nav{margin-top:28px;display:grid;gap:6px}nav button{text-align:left;border:0;background:transparent}nav button.active{background:#f0eaff;color:var(--purple);font-weight:700}main{margin-left:220px;padding:28px;max-width:1700px}header,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:24px}h1{font-size:24px;margin:0}h3{margin-top:0}p.sub{color:var(--muted);margin:6px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.card b{display:block;font-size:26px;margin-top:8px}.card span{color:var(--muted)}.panel{margin:16px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:12px;color:var(--muted);background:#faf9fc}td,th{padding:12px;border-bottom:1px solid var(--line)}td.name{white-space:normal;min-width:180px}.badge{border-radius:6px;background:#f0eaff;color:var(--purple);padding:4px 8px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;color:#555268;font-size:13px}input,select,textarea{border:1px solid #dfdcea;border-radius:8px;background:white;padding:10px;width:100%;color:var(--ink)}textarea{min-height:70px}.wide{grid-column:1/-1}.muted{color:var(--muted)}.bar{height:9px;background:#efeafa;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple)}dialog{border:0;border-radius:16px;max-width:800px;width:94%;padding:24px;max-height:90vh;overflow:auto;box-shadow:0 20px 100px #24203833}dialog::backdrop{background:#24203866}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:14px 20px;border-radius:10px;z-index:100;max-width:90%;display:none}.checklist{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px}.checklist label{display:flex;align-items:center;padding:8px}.checklist input{width:auto}.notice{background:#f0eaff;padding:12px;border-radius:9px;color:#6046a8}.split{display:grid;grid-template-columns:2fr 1fr;gap:16px}#doc{display:none}.auditCards{display:none}.auditCard{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.auditCard button{font-size:12px;padding:7px}.auditCard p{margin:7px 0}a{color:var(--purple)}@media(max-width:800px){aside{position:static;width:auto;padding:16px}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap}main{margin:0;padding:16px}.auditDesktop{display:none}.auditCards{display:block}.grid,.split{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{body>*{display:none!important}#doc{display:block!important;background:white;color:black;padding:20px;font-family:serif}#doc table{white-space:normal}#doc td,#doc th{color:black;border:1px solid #555}#doc .row{display:flex;justify-content:space-between}#doc h2{text-align:center}}
</style></head><body>
<aside><h2>◈ Tài sản & Vật tư</h2><small>QUẢN LÝ HỘ KINH DOANH IN ẢNH</small><nav id="nav"></nav><p class="muted">Google Sheets · Apps Script</p></aside>
<main><header><div><h1 id="title">Đang tải…</h1><p class="sub" id="subtitle">Dữ liệu lưu trong Google Sheets của bạn</p></div><button onclick="load()">↻ Làm mới</button></header><div id="content">Đang kết nối dữ liệu…</div></main>
<dialog id="modal"><h3 id="modalTitle"></h3><form id="form"><div id="fields" class="grid"></div><div class="actions"><button type="button" onclick="modal.close()">Hủy</button><button class="primary" id="submit">Lưu</button></div></form></dialog><div id="toast" role="status"></div><article id="doc"></article>
<?!= HtmlService.createHtmlOutputFromFile('QR').getContent(); ?>
<script>
let D, page='overview', busy=false, lastDoc='', reportMonth='', auditSelected='';
const pages={overview:'Tổng quan',assets:'1 · Nhập kho / Tài sản',issue:'2 · Cấp phát / Điều chuyển',tracking:'3 · Theo dõi',audit:'4 · Kiểm kê',recover:'5 · Thu hồi / Thanh lý',report:'6 · Báo cáo',stock:'Nhập – Xuất – Tồn',employees:'Nhân viên',catalog:'Danh mục',settings:'Cài đặt'};
const labels={TRONG_KHO:'Trong kho',DANG_DUNG:'Đang sử dụng',THANH_LY:'Đã thanh lý',CAP_PHAT:'Cấp phát',DIEU_CHUYEN:'Điều chuyển',THU_HOI:'Thu hồi',NHAP_VT:'Nhập vật tư',XUAT_VT:'Xuất vật tư',CHUA_KIEM:'Chưa kiểm',CO_MAT:'Có mặt',THIEU:'Thiếu / lệch số lượng',HONG:'Hỏng',SAI_VI_TRI:'Sai vị trí'};
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>Number(x||0).toLocaleString('vi-VN')+' ₫', num=x=>Number(x||0).toLocaleString('vi-VN',{maximumFractionDigits:3}), date=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date());
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',6000)}
function call(fn,args,done){google.script.run.withSuccessHandler(done).withFailureHandler(e=>{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);toast(e.message||String(e))})[fn](...args)}
function load(){call('getData',[],d=>{D=d;reportMonth=d.month;render()})}
function card(label,value){return `<div class="card"><span>${esc(label)}</span><b>${esc(value)}</b></div>`}
function table(headers,body){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body.length?body.join(''):`<tr><td colspan="${headers.length}" class="muted">Chưa có dữ liệu</td></tr>`}</tbody></table></div>`}
function employee(id){return (D.employees.find(e=>e.id===id)||{}).name||'—'}
function assetRows(list){return list.map(a=>`<tr><td>${esc(a.code)}</td><td class="name">${esc(a.name)}${a.sample==='true'?'<small class="muted"> · Mẫu</small>':''}</td><td>${esc((D.types.find(t=>t.id===a.kind)||{}).name)}</td><td><span class="badge">${esc(labels[a.status])}</span></td><td>${esc(employee(a.employeeId))}</td><td>${esc(a.location)}</td><td>${a.kind==='VT'?num(D.stock[a.id]?.quantity):money(a.price)}</td><td><button onclick="assetForm('${a.id}')">Sửa</button> <button onclick="detail('${a.id}')">Chi tiết</button></td></tr>`)}
function txRows(list){return list.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(labels[t.type]||t.type)}</td><td>${esc(t.assetCode)}</td><td class="name">${esc(t.assetName)}</td><td>${num(t.quantity)}</td><td>${money(t.amount)}</td><td>${esc(t.employeeName)}</td><td><button onclick="documentFor('${t.requestId||t.id}')">Biên bản</button></td></tr>`)}
function render(){
  if(!D)return; $('title').textContent=pages[page];$('subtitle').textContent=D.settings.businessName||'Hộ kinh doanh in ảnh';
  $('nav').innerHTML=Object.entries(pages).map(([id,name])=>`<button class="${page===id?'active':''}" onclick="page='${id}';render()">${name}</button>`).join('');
  const fixed=D.assets.filter(a=>a.kind!=='VT'), active=D.report.filter(a=>!a.disposed), total=active.reduce((s,a)=>s+Number(a.price),0);
  let html='';
  if(page==='overview'){
    html=`<div class="notice">Quản lý trọn vòng đời tài sản và vật tư · dữ liệu mẫu được đánh dấu “Mẫu”.</div><div class="cards">${card('Tài sản đang quản lý',fixed.filter(a=>a.status!=='THANH_LY').length)}${card('Đang sử dụng',fixed.filter(a=>a.status==='DANG_DUNG').length)}${card('Trong kho',fixed.filter(a=>a.status==='TRONG_KHO').length)}${card('Sản phẩm vật tư',Object.keys(D.stock).length)}</div><div class="split"><section class="panel"><h3>Giá trị tài sản · ${esc(D.month)}</h3><div class="cards">${card('Nguyên giá',money(total))}${card('Còn lại',money(active.reduce((s,a)=>s+a.remaining,0)))}</div><h3>Phân bố tài sản</h3>${D.types.filter(t=>t.id!=='VT').map(t=>{const count=fixed.filter(a=>a.kind===t.id&&a.status!=='THANH_LY').length;return `<p>${esc(t.name)} <b>${count}</b></p><div class="bar"><i style="width:${100*count/Math.max(1,fixed.length)}%"></i></div>`}).join('')}</section><section class="panel"><h3>Việc cần xem</h3><p>Kiểm kê đang mở: ${D.audits.filter(a=>a.status==='MO').length}</p><p>Vật tư hết tồn: ${Object.values(D.stock).filter(s=>s.quantity<=0).length}</p><button onclick="page='audit';render()">Mở kiểm kê</button><p class="muted">Khấu hao là số liệu quản lý nội bộ.</p></section></div><section class="panel"><h3>Chi phí mua vào · 12 tháng</h3>${monthlyChart()}</section><section class="panel"><h3>Hoạt động gần đây</h3>${table(['Ngày','Loại phiếu','Mã','Tên','SL','Giá trị','Người nhận',''],txRows(D.transactions.slice(-8).reverse()))}</section>`;
  }
  if(page==='assets')html=`<div class="row"><button class="primary" onclick="assetForm()">＋ Thêm tài sản / sản phẩm</button><input style="max-width:350px" placeholder="Tìm mã, tên, người giữ, vị trí…" oninput="filterAssets(this.value)"></div><section class="panel" id="assetTable">${table(['Mã','Tên','Loại','Trạng thái','Người giữ','Vị trí','Giá mua / Tồn',''],assetRows(D.assets))}</section>`;
  if(['issue','recover','stock'].includes(page)){
    const ops=page==='issue'?['CAP_PHAT','DIEU_CHUYEN']:page==='recover'?['THU_HOI','THANH_LY']:['NHAP_VT','XUAT_VT'];
    html=`<div class="row">${ops.map(t=>`<button class="${t==='THANH_LY'?'danger':'primary'}" onclick="transactionForm('${t}')">＋ ${labels[t]}</button>`).join('')}</div>`;
    if(page==='stock')html+=`<section class="panel"><h3>Tồn kho · giá bình quân di động</h3>${table(['Mã','Sản phẩm','ĐVT','Tồn','Giá bình quân','Giá trị tồn'],D.assets.filter(a=>a.kind==='VT').map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${esc(a.unit)}</td><td>${num(D.stock[a.id]?.quantity)}</td><td>${money(D.stock[a.id]?.average)}</td><td>${money(D.stock[a.id]?.value)}</td></tr>`))}</section>`;
    html+=`<section class="panel"><h3>Lịch sử phiếu</h3>${table(['Ngày','Loại phiếu','Mã','Tên','SL','Giá trị','Người nhận',''],txRows(D.transactions.filter(t=>ops.includes(t.type)).slice().reverse()))}</section>`;
  }
  if(page==='tracking')html=`<section class="panel"><div class="row"><h3>Theo dõi tài sản</h3><button onclick="maintenanceForm()">＋ Ghi bảo trì</button></div>${table(['Mã','Tên','Loại','Trạng thái','Người giữ','Vị trí','Giá mua / Tồn',''],assetRows(D.assets))}</section><section class="panel"><h3>Bảo trì / sửa chữa</h3>${table(['Ngày','Tài sản','Nội dung','Chi phí','Hẹn tiếp'],D.maintenance.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc((D.assets.find(a=>a.id===m.assetId)||{}).name)}</td><td>${esc(m.content)}</td><td>${money(m.cost)}</td><td>${esc(m.nextDate)}</td></tr>`))}</section>`;
  if(page==='audit'){
    if(!D.audits.some(a=>a.id===auditSelected))auditSelected=D.audits.at(-1)?.id||'';
    const a=D.audits.find(a=>a.id===auditSelected), lines=D.auditLines.filter(l=>l.auditId===auditSelected);
    html=`<div class="row"><button class="primary" onclick="auditForm()">＋ Tạo đợt kiểm kê</button><select style="max-width:400px" onchange="auditSelected=this.value;render()">${D.audits.map(a=>`<option value="${a.id}" ${a.id===auditSelected?'selected':''}>${esc(a.name)} · ${a.date} · ${a.status==='MO'?'Đang mở':'Đã chốt'}</option>`).join('')}</select>${a?'<button onclick="closeAudit()">Chốt đợt</button><button onclick="auditPrint()">In / PDF kết quả</button>':''}</div><div class="cards">${card('Tổng mục',lines.length)}${card('Chưa kiểm',lines.filter(l=>l.result==='CHUA_KIEM').length)}${card('Có vấn đề',lines.filter(l=>!['CHUA_KIEM','CO_MAT'].includes(l.result)).length)}</div><section class="panel"><div class="auditCards">${lines.map(l=>`<div class="auditCard"><b>${esc(l.assetName)}</b><p class="muted">${esc(l.assetCode)} · ${esc(l.location)} · ${esc(l.employeeName)}</p><p>Theo sổ: ${num(l.expected)} · Thực tế: ${esc(l.actual)} · ${esc(labels[l.result])}</p>${a?.status==='MO'?`<div class="row">${['CO_MAT','THIEU','HONG','SAI_VI_TRI'].map(r=>`<button onclick="auditQuick('${l.id}','${r}')">${esc(labels[r])}</button>`).join('')}</div>`:''}<p>${esc(l.note)}</p></div>`).join('')}</div><div class="auditDesktop">${table(['Mã','Tên','Người giữ / vị trí','Theo sổ','Thực tế','Kết quả',''],lines.map(l=>`<tr><td>${esc(l.assetCode)}</td><td class="name">${esc(l.assetName)}</td><td>${esc(l.employeeName)} / ${esc(l.location)}</td><td>${num(l.expected)}</td><td>${esc(l.actual)}</td><td>${esc(labels[l.result])}</td><td>${a?.status==='MO'?`<button onclick="auditLineForm('${l.id}')">Ghi nhận</button>`:''}</td></tr>`))}</div></section>`;
  }
  if(page==='report') html=`<div class="row"><input type="month" style="width:180px" value="${esc(reportMonth||D.month)}" onchange="reportMonth=this.value;call('getReport',[this.value],r=>{D.report=r;render()})"><button onclick="send('exportDepreciation',{month:reportMonth||D.month})">Xuất vào Sheets</button><button onclick="exportCSV()">Tải CSV</button></div><div class="cards">${card('Nguyên giá đang quản lý',money(total))}${card('Khấu hao lũy kế',money(active.reduce((s,a)=>s+a.accumulated,0)))}${card('Còn lại',money(active.reduce((s,a)=>s+a.remaining,0)))}${card('Tồn vật tư hiện tại',money(Object.values(D.stock).reduce((s,a)=>s+a.value,0)))}</div><p class="muted">Khấu hao tính từ tháng mua, dừng sau tháng thanh lý. Tồn vật tư là số hiện tại, không phải tồn cuối tháng được chọn. Chỉnh giá/ngày mua sẽ tính lại các tháng trước.</p><section class="panel">${table(['Mã','Tên','Ngày mua','Nguyên giá','Số tháng','Mức / tháng','Lũy kế','Còn lại','Thanh lý'],D.report.map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${esc(a.purchaseDate)}</td><td>${money(a.price)}</td><td>${esc(a.months)}</td><td>${money(a.monthly)}</td><td>${money(a.accumulated)}</td><td>${money(a.remaining)}</td><td>${a.disposed?'Có':'—'}</td></tr>`))}</section>`;
  if(page==='employees')html=`<button class="primary" onclick="employeeForm()">＋ Thêm nhân viên</button><section class="panel">${table(['Tên','Bộ phận','Vị trí','Email','Trạng thái',''],D.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.department)}</td><td>${esc(e.location)}</td><td>${esc(e.email)}</td><td>${e.active==='true'?'Đang làm':'Ngừng'}</td><td><button onclick="employeeForm('${e.id}')">Sửa</button></td></tr>`))}</section>`;
  if(page==='catalog') html=['LoaiTaiSan','NhomSanPham'].map((t,i)=>`<section class="panel"><div class="row"><h3>${i?'Nhóm vật tư':'Loại tài sản'}</h3><button onclick="categoryForm('${t}')">＋ Thêm</button></div>${table(['Tên','Tiền tố'],(i?D.groups:D.types).map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.prefix)}</td></tr>`))}</section>`).join('')+'<p class="muted">Loại thêm mới là tài sản theo từng chiếc. Các sản phẩm tiêu hao đặt trong loại Vật tư và chọn nhóm tương ứng.</p>';
  if(page==='settings')html=`<section class="panel"><h3>Cấu hình hộ kinh doanh</h3><p>${esc(D.settings.businessName)}</p><p>${esc(D.settings.address)}</p><p>Email nhắc: ${esc(D.settings.reminderEmail||'Chưa bật')} · trước ${esc(D.settings.reminderDays)} ngày</p><button onclick="settingsForm()">Chỉnh sửa</button></section><section class="panel"><h3>Nhắc hằng ngày</h3><p>Chỉ gửi đến email bạn cấu hình. Sau khi lưu địa chỉ, bật tại menu “Quản lý tài sản” trong Google Sheets. Google sẽ yêu cầu bạn cấp quyền gửi email.</p><h3>Dữ liệu & quyền truy cập</h3><p>Triển khai web app ở chế độ Chỉ mình tôi. Không chia sẻ link công khai vì dữ liệu gồm giá mua và thông tin nhân viên.</p><p>Biên bản có thể in, lưu PDF bằng trình duyệt hoặc lưu vào Drive riêng. Mẫu dựng lại theo phần nhìn thấy trong video, cần kiểm tra nội dung trước khi ký.</p></section>`;
  $('content').innerHTML=html;
}
function monthlyChart(){const current=D.month.split('-').map(Number);const bins=Array.from({length:12},(_,i)=>{const dt=new Date(Date.UTC(current[0],current[1]-12+i,1));return {month:dt.toISOString().slice(0,7),value:0}});bins.forEach(b=>{b.value=D.assets.filter(a=>a.kind!=='VT'&&a.purchaseDate.startsWith(b.month)).reduce((sum,a)=>sum+Number(a.price),0)+D.transactions.filter(t=>t.type==='NHAP_VT'&&t.date.startsWith(b.month)).reduce((sum,t)=>sum+Number(t.amount),0)});const max=Math.max(1,...bins.map(b=>b.value));return `<div style="display:flex;gap:10px;align-items:end;height:180px;overflow-x:auto">${bins.map(b=>`<div style="flex:1;min-width:40px;text-align:center" title="${b.month}: ${money(b.value)}"><div style="height:135px;display:flex;align-items:end;justify-content:center"><div style="width:60%;height:${Math.max(2,130*b.value/max)}px;background:var(--purple);border-radius:5px 5px 0 0"></div></div><small>${b.month.slice(5)}</small></div>`).join('')}</div>`}
function filterAssets(q){q=q.toLocaleLowerCase('vi');$('assetTable').innerHTML=table(['Mã','Tên','Loại','Trạng thái','Người giữ','Vị trí','Giá mua / Tồn',''],assetRows(D.assets.filter(a=>[a.code,a.name,a.location,employee(a.employeeId)].join(' ').toLocaleLowerCase('vi').includes(q))))}
function input(name,label,value='',type='text',extra=''){return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(name,label,items,value=''){return `<label>${esc(label)}<select name="${name}">${items.map(x=>`<option value="${esc(x[0])}" ${String(value)===String(x[0])?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label>`}
function note(name,label,value=''){return `<label class="wide">${esc(label)}<textarea name="${name}">${esc(value)}</textarea></label>`}
function openForm(title,fields,handler){$('modalTitle').textContent=title;$('fields').innerHTML=fields;$('form').onsubmit=e=>{e.preventDefault();if(busy)return;const p=Object.fromEntries(new FormData(e.target));handler(p,e.target)};$('modal').showModal()}
function send(action,p){if(busy)return;busy=true;p.requestId=p.requestId||('req_'+Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join(''));document.querySelectorAll('button').forEach(b=>b.disabled=true);call('mutate',[action,p],r=>{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('modal').close();D=r.data;reportMonth=D.month;render();toast(r.message)})}
function assetForm(id){const a=D.assets.find(a=>a.id===id)||{};openForm(id?'Sửa thông tin · '+a.code:'Nhập tài sản / khai báo sản phẩm',
  input('name','Tên *',a.name,'text','required')+select('kind','Loại',D.types.map(t=>[t.id,t.name]),a.kind||'VT')+select('group','Nhóm vật tư',D.groups.map(g=>[g.id,g.name]),a.group)+input('unit','Đơn vị tính *',a.unit||'Cái','text','required')+input('price','Giá mua / đơn giá tham khảo *',a.price??0,'number','min="0" step="any" required')+input('purchaseDate','Ngày mua *',a.purchaseDate||date(),'date','required')+input('purchaseTime','Giờ mua',a.purchaseTime||'09:00','time')+input('months','Số tháng khấu hao (tài sản)',a.months||36,'number','min="1" step="1"')+input('supplier','Nhà cung cấp',a.supplier)+input('serial','Serial',a.serial)+input('warrantyDate','Hết bảo hành',a.warrantyDate,'date')+input('location','Vị trí',a.location||'Kho chính')+note('note','Ghi chú',a.note),p=>send('saveAsset',{...p,id}));
  if(id){$('form').elements.kind.disabled=true;const hidden=document.createElement('input');hidden.type='hidden';hidden.name='kind';hidden.value=a.kind;$('form').appendChild(hidden);$('modal').addEventListener('close',()=>hidden.remove(),{once:true})}
}
function transactionForm(type){const vt=type.endsWith('_VT');const states={CAP_PHAT:'TRONG_KHO',DIEU_CHUYEN:'DANG_DUNG',THU_HOI:'DANG_DUNG'};
 const available=D.assets.filter(a=>vt?a.kind==='VT':a.kind!=='VT'&&(states[type]?a.status===states[type]:a.status!=='THANH_LY'));
 const choices=vt?select('assetId','Sản phẩm',available.map(a=>[a.id,`${a.code} · ${a.name} · tồn ${num(D.stock[a.id]?.quantity)}`])):`<div class="wide checklist">${available.map(a=>`<label><input type="checkbox" name="assetIds" value="${a.id}">${esc(a.code)} · ${esc(a.name)} · ${esc(employee(a.employeeId))}</label>`).join('')||'Không có tài sản phù hợp'}</div>`;
 let fields=choices+input('date','Ngày phiếu *',date(),'date','required');
 if(vt)fields+=input('quantity','Số lượng *',1,'number','min="0.000001" step="any" required')+(type==='NHAP_VT'?input('unitPrice','Đơn giá nhập *',0,'number','min="0" step="any" required'):'<p class="notice">Giá xuất được tính theo bình quân di động; không cho phép âm kho.</p>');
 if(['CAP_PHAT','DIEU_CHUYEN'].includes(type))fields+=select('employeeId','Người nhận *',[['','Chọn nhân viên'],...D.employees.filter(e=>e.active==='true').map(e=>[e.id,e.name])]);
 if(!vt)fields+=input('location','Vị trí (trống: lấy theo người nhận)',type==='THU_HOI'?'Kho chính':'')+input('condition','Tình trạng','Tốt');
 if(type==='THANH_LY')fields+=input('amount','Giá thu hồi mỗi tài sản *',0,'number','min="0" step="any" required')+input('reason','Lý do *','','text','required')+input('approver','Người duyệt')+input('decision','Số quyết định');
 fields+=note('note','Ghi chú');openForm(labels[type],fields,(p,form)=>{p.assetIds=vt?[p.assetId]:new FormData(form).getAll('assetIds');p.type=type;send('transaction',p)});
 if(['CAP_PHAT','DIEU_CHUYEN'].includes(type))$('form').elements.employeeId.onchange=e=>{const emp=D.employees.find(x=>x.id===e.target.value);if(emp)$('form').elements.location.value=emp.location};
}
function employeeForm(id){const e=D.employees.find(e=>e.id===id)||{};openForm('Nhân viên',input('name','Họ tên *',e.name,'text','required')+input('department','Bộ phận',e.department)+input('location','Vị trí làm việc',e.location)+input('email','Email',e.email,'email')+select('active','Trạng thái',[['true','Đang làm'],['false','Ngừng làm']],e.active||'true'),p=>send('saveEmployee',{...p,id}))}
function categoryForm(tableName){openForm('Thêm danh mục',input('name','Tên *','','text','required')+input('prefix','Tiền tố *','','text','required pattern="[A-Za-z][A-Za-z0-9]{1,7}"'),p=>send('addCategory',{...p,table:tableName}))}
function auditForm(){openForm('Tạo đợt kiểm kê',input('name','Tên đợt *','Kiểm kê tháng '+date().slice(0,7),'text','required')+input('date','Ngày kiểm kê *',date(),'date','required'),p=>send('createAudit',p))}
function auditLineForm(id){const l=D.auditLines.find(l=>l.id===id);openForm(l.assetCode+' · '+l.assetName,input('actual','Số lượng thực tế *',l.actual===''?l.expected:l.actual,'number','min="0" step="any" required')+select('result','Kết quả',[['CO_MAT','Có mặt / khớp sổ'],['THIEU','Thiếu / lệch số lượng'],['HONG','Hỏng'],['SAI_VI_TRI','Sai vị trí']],l.result)+note('note','Ghi chú',l.note),p=>send('saveAuditLine',{...p,id}))}
function auditQuick(id,result){auditLineForm(id);$('form').elements.result.value=result;if(result==='THIEU')$('form').elements.actual.value=0}
function closeAudit(){if(confirm('Chốt đợt kiểm kê? Sau khi chốt không sửa kết quả trên giao diện.'))send('closeAudit',{id:auditSelected})}
function maintenanceForm(){openForm('Ghi bảo trì / sửa chữa',select('assetId','Tài sản',D.assets.filter(a=>a.kind!=='VT'&&a.status!=='THANH_LY').map(a=>[a.id,a.code+' · '+a.name]))+input('date','Ngày',date(),'date','required')+input('cost','Chi phí',0,'number','min="0" step="any" required')+input('nextDate','Lần tiếp theo','','date')+note('content','Nội dung'),p=>send('maintenance',p))}
function settingsForm(){const c=D.settings;openForm('Cài đặt',input('businessName','Tên hộ kinh doanh',c.businessName)+input('address','Địa chỉ',c.address)+input('reminderEmail','Email nhận nhắc',c.reminderEmail,'email')+input('reminderDays','Nhắc trước (ngày)',c.reminderDays,'number','min="0"'),p=>send('settings',p))}
function detail(id){const a=D.assets.find(a=>a.id===id);openForm(a.code+' · '+a.name,`<div class="wide"><p>Người giữ: ${esc(employee(a.employeeId))} · ${esc(a.location)}</p><p>Ngày giờ mua: ${esc(a.purchaseDate)} ${esc(a.purchaseTime)} · ${money(a.price)}</p><p>Ghi chú: ${esc(a.note)}</p><div>${qr(a.code)}</div><p class="muted">QR chứa mã tài sản; quét mã rồi tìm trong danh sách.</p><button type="button" onclick="printQR('${a.id}')">In tem QR</button><h3>Lịch sử phiếu</h3>${table(['Ngày','Loại phiếu','Mã','Tên','SL','Giá trị','Người nhận',''],txRows(D.transactions.filter(t=>t.assetId===id)))}<h3>Lịch sử sửa thông tin</h3>${D.history.filter(h=>h.assetId===id).map(h=>`<details><summary>${esc(h.createdAt)} · ${esc(h.actor)}</summary><p>Trước: ${esc(h.before)}</p><p>Sau: ${esc(h.after)}</p></details>`).join('')||'<p>Chưa chỉnh sửa</p>'}</div>`,()=>{});$('submit').style.display='none';$('modal').addEventListener('close',()=>{$('submit').style.display=''}, {once:true})}
function documentFor(id){const tx=D.transactions.filter(t=>(t.requestId||t.id)===id), t=tx[0];if(!t)return;const term=D.terms.find(t=>t.key==='handoverTerms')?.value||'';showDocument('BIÊN BẢN '+(labels[t.type]||'TÀI SẢN').toUpperCase(),`<p>Ngày: ${esc(t.date)} · Mã phiếu: ${esc(id)}</p><p>Người nhận: ${esc(t.employeeName||employee(t.oldEmployee))} · Bộ phận: ${esc(t.department)} · Vị trí: ${esc(t.location)}</p>${table(['STT','Mã','Tên','Số lượng','Tình trạng','Giá trị / Thu hồi'],tx.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.assetCode)}</td><td>${esc(x.assetName)}</td><td>${num(x.quantity)}</td><td>${esc(x.condition)}</td><td>${money(x.amount)}</td></tr>`))}<p>Lý do: ${esc(t.reason)} · Ghi chú: ${esc(t.note)}</p><p>Người duyệt: ${esc(t.approver)} · Số quyết định: ${esc(t.decision)}</p><p>${esc(term)}</p><div class="row"><p>BÊN GIAO<br><small>(Ký, ghi rõ họ tên)</small><br><br><br>________________</p><p>BÊN NHẬN<br><small>(Ký, ghi rõ họ tên)</small><br><br><br>________________</p></div>`)}
function auditPrint(){const a=D.audits.find(a=>a.id===auditSelected);showDocument('BIÊN BẢN KIỂM KÊ',`<p>${esc(a.name)} · Ngày ${esc(a.date)}</p>${table(['Mã','Tên','Theo sổ','Thực tế','Kết quả','Ghi chú'],D.auditLines.filter(l=>l.auditId===a.id).map(l=>`<tr><td>${esc(l.assetCode)}</td><td>${esc(l.assetName)}</td><td>${num(l.expected)}</td><td>${esc(l.actual)}</td><td>${esc(labels[l.result])}</td><td>${esc(l.note)}</td></tr>`))}<p>NGƯỜI KIỂM KÊ __________________ &nbsp; CHỦ CƠ SỞ __________________</p>`)}
function showDocument(title,body){lastDoc=`<h3>${esc(D.settings.businessName)}</h3><p>${esc(D.settings.address)}</p><h2>${esc(title)}</h2>${body}`;$('doc').innerHTML=lastDoc;openForm(title,`<div class="wide"><p>Biên bản đã sẵn sàng. Kiểm tra bản in trước khi ký.</p><button type="button" onclick="window.print()">In / Lưu PDF</button> <button type="button" onclick="driveDocument()">Lưu PDF vào Drive</button></div>`,()=>{});$('submit').style.display='none';$('modal').addEventListener('close',()=>{$('submit').style.display=''}, {once:true})}
function driveDocument(){call('saveDocument',['<!doctype html><html><meta charset="utf-8"><body>'+lastDoc+'</body></html>','Bien-ban-'+date()],url=>{const p=document.createElement('p'),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='Mở PDF đã lưu trên Drive';p.appendChild(a);$('fields').appendChild(p);toast('Đã lưu Drive')})}
function qr(code){const q=qrcode(0,'M');q.addData(code);q.make();return q.createSvgTag(4,8)}
function printQR(id){const a=D.assets.find(a=>a.id===id);showDocument('TEM TÀI SẢN',`<div style="text-align:center">${qr(a.code)}<h3>${esc(a.code)}</h3><p>${esc(a.name)}</p></div>`)}
function exportCSV(){const data=[['Mã','Tên','Tháng','Nguyên giá','Khấu hao/tháng','Lũy kế','Còn lại'],...D.report.map(a=>[a.code,a.name,reportMonth||D.month,a.price,a.monthly,a.accumulated,a.remaining])];const csv='\ufeff'+data.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='khau-hao-'+(reportMonth||D.month)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
if(typeof google!=='undefined'&&google.script)load();else $('content').innerHTML='<div class="notice">Mở giao diện qua URL Web App sau khi triển khai trong Google Apps Script. Xem README để cài đặt.</div>';
</script></body></html>
