<script>
(function(){
  window.__assetReady=false;
  function loadingError(message){if(window.__assetReady)return;const host=document.getElementById('content');if(!host)return;host.replaceChildren();const panel=document.createElement('div');panel.className='panel error-screen';const title=document.createElement('h2');title.textContent='Chưa tải được dữ liệu';const text=document.createElement('p');text.textContent=message;const help=document.createElement('p');help.className='sub';help.textContent='Không xóa dữ liệu hoặc chạy seedDemo. Kiểm tra mục Lần thực thi trong Apps Script và chụp thông báo này.';const button=document.createElement('button');button.textContent='Thử tải lại';button.onclick=function(){if(window.__assetReady&&typeof load==='function')load();else location.reload();};panel.append(title,text,help,button);host.append(panel);}
  window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'&&e.target.src){loadingError('Không tải được tệp giao diện. Kiểm tra kết nối tới cdn.jsdelivr.net rồi bấm Thử tải lại.');return;}if(e.message)loadingError(e.message+(e.lineno?' (dòng '+e.lineno+')':''));},true);
  window.addEventListener('unhandledrejection',function(e){loadingError(e.reason&&e.reason.message||String(e.reason));});
  window.__assetLoadingTimer=setTimeout(function(){loadingError('Kết nối chưa hoàn tất sau 60 giây. Máy chủ có thể đang xử lý hoặc chưa gọi được. Bạn có thể bấm Thử tải lại.');},60000);
})();
</script>
